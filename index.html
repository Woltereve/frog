<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>Maquette</title>
  </head>
  <body>
    <header>
      <img class="froggy" src="./image/frog_cage.png" alt="" />
      <!-- j'ai pris le cadre pas l'image -->
    </header>

    <main>
      <div class="info">
        <h2>MFM DIGITAL</h2>

        <address>
          Rue Middelbourg 66, 1170 Watermael-Boitsfort<br />
          <a href="tel:+3228809692"> +32 2 880 96 92 </a><br />
          <a href="mailto:info@mfmdigital.com"> info@mfmdigital.com </a>
        </address>
        <!-- lien cliquable -->
        <img class="facebook" src="./image/fb.svg" alt="" />
        <img class="linkedin" src="./image/linkedin.svg" alt="" />
      </div>

      <div class="contact">
        <h1>CONTACTEZ-NOUS</h1>
        <p>
          Notre agence vous promet une expertise personnalisée et un
          accompagnement sur-mesure pour la réalisation de votre site internet
          et/ou de votre application.
        </p>

        <form method="POST" action="connect.php">
          <!-- iconify-->

          <ul class="segmented">
            <li class="segmented-control__item">
              <input
                class="segmented-control__input"
                type="radio"
                value="1"
                name="option"
                id="option-1"
                checked
              />
              <label class="segmented-control__label" for="option-1"
                ><img
                  class="frog"
                  src="./image/frog-icone.svg"
                  alt=""
                />"</label
              >
            </li>
            <li class="segmented-control__item">
              <input
                class="segmented-control__input"
                type="radio"
                value="2"
                name="option"
                id="option-2"
              />
              <label class="segmented-control__label" for="option-2"
                ><img class="patte" src="./image/frog-patte.svg" alt="" />
              </label>
            </li>
          </ul>

          <label for="nom">Nom</label>
          <input id="nom" name="nom" required />

          <label for="prenom">Prénom</label>
          <input id="prenom" name="prenom" required />

          <label for="telephone">Numéro de téléphone</label>
          <input type="tel" id="telephone" name="telephone" required />

          <label for="mail">Email</label>
          <input type="email" id="mail" name="mail" required />

          <label for="adresse">Adresse</label>
          <input id="adresse" name="adresse" />

          <label for="postal">Code postal</label>
          <input inputmode="numeric" id="postal" name="postal" />
          <!-- source mdn -->
          <label for="ville">Ville</label>
          <input id="ville" name="ville" />

          <div>
            <input type="checkbox" id="accepter" name="accepter" required />
            <label for="accepter">
              J’accepte que mes données soient recueillies par une famille de
              crapauds ou de grenouilles aux étangs d’Ixelles.
            </label>
          </div>

          <button type="submit">envoyer</button>
        </form>
      </div>
    </main>
  </body>
</html>
